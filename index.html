<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>自習室預約與掃碼系統</title>
    <style>
      body { font-family: Arial, sans-serif; padding: 20px; }
      /* 您原本的 CSS 樣式會放在這裡 */
    </style>
  </head>
  <body>
    <!-- 您原本的網頁內容、掃碼區塊、報到按鈕等放在這裡 -->
    <h2>自習室掃碼報到系統</h2>
    <p>您掃描的座位號碼為：<span id="seatDisplay"><?= scannedSeat ?></span></p>


    <!-- ========================================== -->
    <!-- 以下為新增的【問題回報 UI 介面】 -->
    <!-- ========================================== -->
    
    <!-- 問題回報懸浮按鈕 -->
    <button onclick="document.getElementById('issueModal').style.display='flex'" style="position: fixed; bottom: 20px; right: 20px; padding: 12px 18px; background-color: #d93025; color: white; border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); font-weight: bold; z-index: 999;">
      ⚠️ 問題回報
    </button>

    <!-- 問題回報彈出視窗 (Modal) -->
    <div id="issueModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center;">
      <div style="background: white; padding: 25px; border-radius: 10px; width: 90%; max-width: 400px; box-sizing: border-box; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
        <h3 style="margin-top: 0; color: #d93025; border-bottom: 2px solid #fce8e6; padding-bottom: 10px;">系統問題回報</h3>
        
        <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #333;">學號：</label>
        <input type="text" id="issueStudentId" placeholder="請輸入您的學號" style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;">
        
        <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #333;">聯絡信箱：</label>
        <input type="email" id="issueEmail" placeholder="請輸入 Email" style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;">
        
        <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #333;">問題分類：</label>
        <select id="issueCategory" style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;">
          <option value="掃碼報到異常">掃碼報到異常</option>
          <option value="無法歸還打卡">無法歸還打卡</option>
          <option value="座位已被佔用">座位已被佔用</option>
          <option value="環境髒亂通報">環境髒亂通報</option>
          <option value="其他系統問題">其他系統問題</option>
        </select>
        
        <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #333;">問題描述：</label>
        <textarea id="issueDescription" rows="4" placeholder="請詳細描述您遇到的問題..." style="width: 100%; padding: 10px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; resize: vertical;"></textarea>
        
        <div style="text-align: right;">
          <button onclick="document.getElementById('issueModal').style.display='none'" style="padding: 10px 15px; margin-right: 10px; background: #e0e0e0; color: #333; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">取消</button>
          <button onclick="submitIssueReport()" id="submitIssueBtn" style="padding: 10px 15px; background: #1a73e8; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">送出回報</button>
        </div>
      </div>
    </div>


    <!-- ========================================== -->
    <!-- 以下為 JavaScript 邏輯區 -->
    <!-- ========================================== -->
    <script>
      // 假設這是您原本用來打 API 的網址變數
      // 如果是用 GAS 的測試環境，通常會自動帶入網址
      const WEB_APP_URL = "您的 Web App 部署網址放這裡"; 

      // 您原本的 function，例如 checkin() 等等...

      /**
       * 新增的：提交問題回報 function
       */
      function submitIssueReport() {
        const studentId = document.getElementById('issueStudentId').value.trim();
        const email = document.getElementById('issueEmail').value.trim();
        const category = document.getElementById('issueCategory').value;
        const description = document.getElementById('issueDescription').value.trim();

        if (!studentId || !email || !description) {
          alert("請完整填寫學號、信箱與問題描述！");
          return;
        }

        const btn = document.getElementById('submitIssueBtn');
        btn.innerText = "發送中...";
        btn.disabled = true;

        const payload = {
          action: 'reportIssue',
          args: [studentId, email, category, description]
        };

        // 呼叫 Code.gs 的 doPost
        fetch(WEB_APP_URL, { 
          method: 'POST',
          body: JSON.stringify(payload)
        })
        .then(response => response.json())
        .then(data => {
          if (data.success) {
            alert("回報成功！管理員已收到您的信件通知。");
            document.getElementById('issueModal').style.display = 'none'; 
            document.getElementById('issueDescription').value = '';       
          } else {
            alert("回報失敗：" + data.message);
          }
        })
        .catch(err => {
          console.error(err);
          alert("網路連線異常，發送失敗，請稍後再試。");
        })
        .finally(() => {
          btn.innerText = "送出回報";
          btn.disabled = false;
        });
      }
    </script>
  </body>
</html>
